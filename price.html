<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>가격표 | 준오헤어 건대역2호점</title>
  <meta name="description" content="준오헤어 건대역2호점 커트, 펌, 컬러, 케어 시술 가격 안내. 실제 시술 금액은 모발 길이와 상태, 담당 디자이너 및 시술 내용에 따라 달라질 수 있습니다.">
  <link rel="canonical" href="https://www.junokd02.com/price.html">
  <link rel="stylesheet" href="/style.css">
  <style>
    :root{--price-bg:#f8f1e8;--price-card:#fffaf4;--price-text:#33271f;--price-muted:#7b6b60;--price-line:#e8d8c8;--price-accent:#553a2b}
    body{background:var(--price-bg);color:var(--price-text)}
    .priceTop{position:sticky;top:0;z-index:20;background:rgba(248,241,232,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--price-line)}
    .priceNav{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .priceBrand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;font-weight:900;letter-spacing:.08em}
    .priceBrand img{height:30px;width:auto}
    .priceHero{padding:74px 0 38px;text-align:center}
    .priceHero .eyebrow{display:block;margin-bottom:12px;letter-spacing:.2em;font-weight:900;font-size:12px;color:#8e705b}
    .priceHero h1{font-size:clamp(38px,7vw,72px);line-height:1;margin:0 0 18px;letter-spacing:-.055em}
    .priceHero p{max-width:720px;margin:0 auto;color:var(--price-muted);line-height:1.8}
    .priceTabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0 28px}
    .priceTabs button{border:1px solid var(--price-line);background:#fff7ef;color:#5b493d;border-radius:999px;padding:10px 17px;font-weight:850;cursor:pointer}
    .priceTabs button.on{background:var(--price-accent);color:#fff;border-color:var(--price-accent)}
    .pricePanel{max-width:900px;margin:0 auto 70px;background:var(--price-card);border:1px solid var(--price-line);border-radius:28px;padding:18px 24px;box-shadow:0 16px 45px rgba(74,48,31,.07)}
    .priceRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start;padding:21px 4px;border-bottom:1px solid var(--price-line)}
    .priceRow:last-child{border-bottom:0}
    .priceName{font-weight:900;font-size:18px}
    .priceNote{margin-top:7px;color:var(--price-muted);font-size:13px;line-height:1.6}
    .priceValue{font-size:18px;font-weight:950;white-space:nowrap}
    .priceEmpty{text-align:center;padding:46px 14px;color:var(--price-muted);line-height:1.8}
    .priceNotice{max-width:900px;margin:-42px auto 70px;color:var(--price-muted);font-size:13px;line-height:1.75;text-align:center}
    .priceFooter{text-align:center;padding:32px 20px 50px;color:var(--price-muted);font-size:13px}
    @media(max-width:620px){.priceHero{padding-top:50px}.pricePanel{padding:10px 18px;border-radius:22px}.priceRow{grid-template-columns:1fr;gap:8px}.priceValue{font-size:17px}.priceBrand span{display:none}}
  </style>
</head>
<body>
  <header class="priceTop">
    <div class="wrap priceNav">
      <a class="priceBrand" href="/"><img src="/assets/logo-black.png" alt="JUNO HAIR"><span>KONKUK UNIV. 2</span></a>
      <a class="mini" href="/">홈으로 돌아가기</a>
    </div>
  </header>

  <main>
    <section class="priceHero">
      <div class="wrap">
        <span class="eyebrow">SERVICE MENU</span>
        <h1>가격표</h1>
        <p>커트 · 펌 · 컬러 · 케어 시술 가격을 확인해보세요. 정확한 금액은 모발 길이와 상태, 시술 내용 및 담당 디자이너에 따라 달라질 수 있습니다.</p>
      </div>
    </section>

    <section class="wrap">
      <div id="priceTabs" class="priceTabs" aria-label="가격표 카테고리"></div>
      <div id="pricePanel" class="pricePanel"><div class="priceEmpty">가격표를 불러오는 중입니다.</div></div>
      <p class="priceNotice">※ 표시된 가격은 안내용이며, 상세 시술 금액은 상담 후 달라질 수 있습니다. 기장 추가·디자인 추가 등은 매장 상담을 통해 확인해 주세요.</p>
    </section>
  </main>

  <footer class="priceFooter">© JUNO HAIR KONKUK UNIV. 2. ALL RIGHTS RESERVED.</footer>

  <script type="module">
    const labels={cut:'커트',perm:'펌',color:'컬러',care:'케어',extra:'기타'};
    const esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    let items=[], active='';

    function render(){
      const cats=[...new Set(items.map(x=>x.category).filter(Boolean))];
      const tabs=document.getElementById('priceTabs');
      const panel=document.getElementById('pricePanel');
      if(!cats.length){
        tabs.innerHTML='';
        panel.innerHTML='<div class="priceEmpty"><b>가격표가 아직 등록되지 않았습니다.</b><br>매장 문의 또는 네이버 예약을 이용해 주세요.</div>';
        return;
      }
      if(!active || !cats.includes(active)) active=cats[0];
      tabs.innerHTML=cats.map(c=>`<button type="button" data-cat="${esc(c)}" class="${c===active?'on':''}">${esc(labels[c]||c)}</button>`).join('');
      const rows=items.filter(x=>x.category===active);
      panel.innerHTML=rows.map(x=>`<div class="priceRow"><div><div class="priceName">${esc(x.name)}</div>${x.note?`<div class="priceNote">${esc(x.note)}</div>`:''}</div><div class="priceValue">${esc(x.price)}</div></div>`).join('');
      tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.cat;render()});
      updateStructuredData();
    }

    function updateStructuredData(){
      document.getElementById('priceStructuredData')?.remove();
      if(!items.length)return;
      const script=document.createElement('script');
      script.id='priceStructuredData';script.type='application/ld+json';
      script.textContent=JSON.stringify({
        '@context':'https://schema.org',
        '@type':'ItemList',
        name:'준오헤어 건대역2호점 가격표',
        itemListElement:items.map((x,i)=>({
          '@type':'ListItem',position:i+1,
          item:{'@type':'Service',name:x.name,description:[labels[x.category]||x.category,x.note].filter(Boolean).join(' · '),offers:{'@type':'Offer',priceCurrency:'KRW',description:x.price}}
        }))
      });
      document.head.appendChild(script);
    }

    try{
      const res=await fetch('/api/prices',{cache:'no-store'});
      const data=await res.json();
      if(!res.ok||!data.ok) throw new Error(data.message||'가격표를 불러오지 못했습니다.');
      items=Array.isArray(data.items)?data.items:[];
      render();
    }catch(err){
      document.getElementById('pricePanel').innerHTML='<div class="priceEmpty">가격표를 불러오지 못했습니다.<br>잠시 후 다시 확인해 주세요.</div>';
      console.error(err);
    }
  </script>
</body>
</html>
