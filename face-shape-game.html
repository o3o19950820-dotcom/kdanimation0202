<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>내 얼굴형에 어울리는 헤어스타일 찾기 | 준오헤어 건대역2호점</title><meta name="description" content="둥근형·긴형·각진형·역삼각형·계란형 얼굴에 어울리는 남자·여자 헤어스타일 추천 미니게임. 준오헤어 건대역2호점 헤어 상담 가이드."><link rel="canonical" href="https://junokd02.com/face-shape-game.html"><style>:root{--ink:#372820;--brown:#765443;--muted:#806c60;--line:#e7d9ce;--paper:#fffbf7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#f8f0e7,#f0e2d6);color:var(--ink);font-family:Pretendard,'Noto Sans KR',sans-serif;min-height:100vh}a{color:inherit}.top{padding:20px max(20px,calc((100vw - 960px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff9f4}.top a{text-decoration:none;font-weight:700}.wrap{max-width:930px;margin:auto;padding:44px 20px 85px}.eyebrow{letter-spacing:.18em;color:var(--brown);font-size:12px;font-weight:800}.hero{text-align:center;margin:15px auto 30px}.hero h1{font-size:clamp(31px,5vw,52px);letter-spacing:-.055em;line-height:1.2;margin:13px 0}.hero p{color:var(--muted);line-height:1.8}.shell{background:var(--paper);border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 45px #67482f13;padding:clamp(20px,4vw,40px)}.stephead{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.bar{height:6px;background:#eee2d8;border-radius:20px;overflow:hidden;margin:14px 0 30px}.bar>div{height:100%;background:var(--brown);transition:width .25s}.question{font-size:clamp(23px,4vw,30px);margin:0 0 8px}.hint{color:var(--muted);line-height:1.7;margin:0 0 24px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px 15px;text-align:left;color:var(--ink);cursor:pointer;font:inherit;min-height:85px;transition:.15s}.choice:hover,.choice:focus-visible{border-color:var(--brown);background:#f9eee4;transform:translateY(-2px)}.choice b{display:block;font-size:17px}.choice small{display:block;color:var(--muted);margin-top:5px;line-height:1.5}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.btn{display:inline-block;text-decoration:none;border:0;background:var(--brown);color:#fff;font-weight:800;padding:13px 20px;border-radius:999px;cursor:pointer;font:inherit}.btn.ghost{background:#eee1d5;color:var(--ink)}.resultTag{display:inline-block;background:#ead8c6;color:#604232;padding:7px 12px;border-radius:99px;font-size:12px;font-weight:700}.resultTitle{font-size:30px;line-height:1.35;margin:16px 0}.resultGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.resultCard{padding:20px;border:1px solid var(--line);background:#fff;border-radius:18px}.resultCard h3{margin:0 0 8px;font-size:18px}.resultCard p{color:var(--muted);line-height:1.8;margin:0}.disclaimer{font-size:13px;color:var(--muted);line-height:1.75;margin:23px 0}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}@media(max-width:600px){.choices,.resultGrid{grid-template-columns:1fr}.wrap{padding-top:25px}.choice{min-height:68px;padding:15px}}</style></head><body><header class="top"><a href="/">JUNO HAIR · 건대역2호점</a><a href="/">홈으로 ↗</a></header><main class="wrap"><div class="hero"><span class="eyebrow">FACE SHAPE · STYLE FINDER</span><h1>내 얼굴형에 어울리는<br>헤어스타일 찾기</h1><p>3가지 질문을 선택하면 취향에 맞는 스타일 아이디어를 추천해 드려요.</p></div><div class="shell" id="game" aria-live="polite"></div><p class="footer">준오헤어 건대역2호점 · 서울 광진구 능동로 109 2층</p></main><script>
const quiz=[{key:'type',title:'어떤 스타일을 찾고 있나요?',hint:'성별과 무관하게 원하는 스타일 카테고리를 골라도 괜찮아요.',items:[['female','여성 헤어스타일','중단발·긴머리·보브·레이어드'],['male','남성 헤어스타일','숏컷·가르마·댄디·펌']]},{key:'shape',title:'내 얼굴형과 가장 가까운 것은?',hint:'정확하게 맞지 않아도 괜찮아요. 가장 비슷한 형태를 선택해 주세요.',items:[['round','둥근형','볼과 턱선이 부드러운 편'],['long','긴형','세로 길이가 상대적으로 긴 편'],['square','각진형','턱선과 윤곽이 뚜렷한 편'],['heart','역삼각형','이마가 넓고 턱이 좁아지는 편'],['oval','계란형','세로와 가로 비율이 비교적 균형적인 편']]},{key:'mood',title:'어떤 분위기를 선호하세요?',hint:'얼굴형만큼 평소 손질 습관과 취향도 중요해요.',items:[['soft','부드럽고 자연스럽게','과하지 않은 볼륨과 움직임'],['chic','시크하고 선명하게','정돈된 라인과 트렌디한 무드'],['easy','손질이 쉬운 스타일','출근·등교 전에 빠르게 완성']]}];
const choices={};let step=0;const el=document.getElementById('game');const reserve='https://map.naver.com/p/entry/place/33431131?placePath=%2Fstylist';const female={round:['사이드뱅 + 레이어드컷','얼굴 옆에 세로 흐름을 주고 층의 시작 위치를 조절해 보세요.'],long:['중단발 C컬 + 시스루뱅','옆 볼륨과 앞머리 길이를 활용해 전체 비율을 조정할 수 있어요.'],square:['페이스라인 레이어드 + S컬','턱 주변에 부드러운 움직임을 더하는 디자인을 상담해 보세요.'],heart:['턱선 근처 볼륨의 보브·단발','턱 주변에 자연스러운 볼륨을 더하는 실루엣을 살펴보세요.'],oval:['레이어드컷 + 자연스러운 펌','선호 길이·모질에 따라 다양한 실루엣을 시도해 볼 수 있어요.']};const male={round:['가르마펌 + 측면 볼륨 조절','윗머리 높이와 옆머리 부피를 조화롭게 조절해 보세요.'],long:['텍스처 크롭 + 가벼운 앞머리','높은 탑 볼륨보다 앞머리와 옆 실루엣의 균형을 살펴보세요.'],square:['소프트 댄디컷 + 자연스러운 펌','선명한 턱선과 부드러운 질감을 함께 살릴 수 있어요.'],heart:['내추럴 가르마 + 옆 볼륨','이마 노출 비율과 턱 주변의 실루엣을 조정해 보세요.'],oval:['가르마펌 또는 댄디컷','원하는 무드와 모질에 맞춰 디자인 폭을 넓혀 보세요.']};const moodTip={soft:'모발 결이 자연스럽게 이어지도록 과한 컬보다 부드러운 흐름을 요청해 보세요.',chic:'라인이 정돈돼 보이는 커트와 앞머리 방향을 상담해 보세요.',easy:'손질 시간을 줄이고 싶다고 먼저 알리고, 드라이·고데기 사용 빈도를 말해 주세요.'};function render(){if(step>=quiz.length)return result();const q=quiz[step];el.innerHTML=`<div class="stephead"><span>STEP ${step+1} / ${quiz.length}</span><span>${Math.round(step/quiz.length*100)}%</span></div><div class="bar"><div style="width:${step/quiz.length*100}%"></div></div><h2 class="question">${q.title}</h2><p class="hint">${q.hint}</p><div class="choices">${q.items.map(([id,name,desc])=>`<button class="choice" data-choice="${id}"><b>${name}</b><small>${desc}</small></button>`).join('')}</div><div class="actions">${step?'<button class="btn ghost" id="back">← 이전 질문</button>':''}</div>`;el.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choices[q.key]=b.dataset.choice;step++;render()});if(step)el.querySelector('#back').onclick=()=>{step--;render()}}function result(){const a=(choices.type==='male'?male:female)[choices.shape];const shapeName=quiz[1].items.find(x=>x[0]===choices.shape)[1];el.innerHTML=`<div class="stephead"><span>MY STYLE RESULT</span><span>100%</span></div><div class="bar"><div style="width:100%"></div></div><span class="resultTag">${shapeName} · 맞춤 스타일 아이디어</span><h2 class="resultTitle">${a[0]}</h2><div class="resultGrid"><div class="resultCard"><h3>이 스타일을 추천하는 이유</h3><p>${a[1]}</p></div><div class="resultCard"><h3>내 취향까지 고려한다면</h3><p>${moodTip[choices.mood]}</p></div></div><p class="disclaimer">얼굴형 분류는 참고용이며 특정 얼굴형에 반드시 어울리는 스타일이 정해져 있지는 않아요. 실제 추천은 모발 굵기·모량·손상도·얼굴의 세부 비율·평소 스타일링을 함께 고려한 상담으로 달라질 수 있습니다.</p><div class="actions"><a class="btn" href="${reserve}" target="_blank" rel="noopener">이 스타일 상담·예약하기 ↗</a><a class="btn ghost" href="/hair-consultation.html">모발 고민별 시술 찾기</a><button class="btn ghost" id="again">다시 하기</button></div>`;el.querySelector('#again').onclick=()=>{step=0;render()}}render();</script></body></html>
